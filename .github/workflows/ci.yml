name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Unit + i18n
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check i18n key parity
        run: npm run i18n:check

      - name: Run unit tests
        run: npm run test:unit

      # Testes de componente (jsdom). Não precisam de banco nem do SDK do Wasp,
      # então rodam junto com os unitários e não na etapa de integração.
      - name: Run UI component tests
        run: npm run test:ui

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [compile]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catequese_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Wasp CLI
        run: npm install -g @wasp.sh/wasp-cli@0.22.0 @wasp.sh/wasp-cli-linux-x64-glibc@0.22.0

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catequese_test
        run: wasp db migrate-dev

      - name: Seed test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catequese_test
          NODE_ENV: development
          SKIP_EMAIL_VERIFICATION_IN_DEV: "true"
          WASP_SERVER_URL: http://localhost:3001
          WASP_WEB_CLIENT_URL: http://localhost:3000
          JWT_SECRET: test-jwt-secret
          PAYMENTS_HOBBY_SUBSCRIPTION_PLAN_ID: ci_test_hobby
          PAYMENTS_PRO_SUBSCRIPTION_PLAN_ID: ci_test_pro
          PAYMENTS_CREDITS_10_PLAN_ID: ci_test_credits10
          STRIPE_API_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          LEMONSQUEEZY_API_KEY: ci_test
          LEMONSQUEEZY_WEBHOOK_SECRET: ci_test
          LEMONSQUEEZY_STORE_ID: ci_test
          POLAR_ORGANIZATION_ACCESS_TOKEN: ci_test
          POLAR_SANDBOX_MODE: "true"
          POLAR_WEBHOOK_SECRET: ci_test
          PLAUSIBLE_API_KEY: ci_test
          PLAUSIBLE_SITE_ID: ci_test
          PLAUSIBLE_BASE_URL: https://ci.example.com
          GOOGLE_ANALYTICS_CLIENT_EMAIL: ci@example.com
          GOOGLE_ANALYTICS_PRIVATE_KEY: ci_test
          GOOGLE_ANALYTICS_PROPERTY_ID: ci_test
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ci_test
          SMTP_PASSWORD: ci_test
          GOOGLE_CLIENT_ID: ci_test
          GOOGLE_CLIENT_SECRET: ci_test
        run: node seed_test_data.js

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catequese_test
          NODE_ENV: development
          SKIP_EMAIL_VERIFICATION_IN_DEV: "true"
          WASP_SERVER_URL: http://localhost:3001
          WASP_WEB_CLIENT_URL: http://localhost:3000
          JWT_SECRET: test-jwt-secret
          PAYMENTS_HOBBY_SUBSCRIPTION_PLAN_ID: ci_test_hobby
          PAYMENTS_PRO_SUBSCRIPTION_PLAN_ID: ci_test_pro
          PAYMENTS_CREDITS_10_PLAN_ID: ci_test_credits10
          STRIPE_API_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          LEMONSQUEEZY_API_KEY: ci_test
          LEMONSQUEEZY_WEBHOOK_SECRET: ci_test
          LEMONSQUEEZY_STORE_ID: ci_test
          POLAR_ORGANIZATION_ACCESS_TOKEN: ci_test
          POLAR_SANDBOX_MODE: "true"
          POLAR_WEBHOOK_SECRET: ci_test
          PLAUSIBLE_API_KEY: ci_test
          PLAUSIBLE_SITE_ID: ci_test
          PLAUSIBLE_BASE_URL: https://ci.example.com
          GOOGLE_ANALYTICS_CLIENT_EMAIL: ci@example.com
          GOOGLE_ANALYTICS_PRIVATE_KEY: ci_test
          GOOGLE_ANALYTICS_PROPERTY_ID: ci_test
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USERNAME: ci_test
          SMTP_PASSWORD: ci_test
          GOOGLE_CLIENT_ID: ci_test
          GOOGLE_CLIENT_SECRET: ci_test
        run: npm run test:integration

  compile:
    name: Wasp compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasp CLI
        run: npm install -g @wasp.sh/wasp-cli@0.22.0 @wasp.sh/wasp-cli-linux-x64-glibc@0.22.0

      - name: Compile project
        env:
          DATABASE_URL: ${{ secrets.HOMOLOG_DATABASE_URL }}
        run: wasp compile
