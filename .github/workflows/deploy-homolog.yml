name: Deploy Homolog

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/catequeze-viva

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wasp CLI
        run: npm install -g @wasp.sh/wasp-cli@0.22.0 @wasp.sh/wasp-cli-linux-x64-glibc@0.22.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: app
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="homolog-${{ github.sha }}"
          docker build -f deploy/Dockerfile.server \
            --build-arg DATABASE_URL="${{ secrets.HOMOLOG_DATABASE_URL }}" \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:homolog-latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:homolog-latest"

      - name: Extract web-app from image
        working-directory: app
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:homolog-${{ github.sha }}"
          CID=$(docker create "${IMAGE}")
          docker cp "${CID}:/app/web-app" ./.wasp/out/web-app
          docker rm "${CID}"

      - name: Copy web-app to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_KEY }}
          source: "app/.wasp/out/web-app/*"
          target: "/opt/catechis/web-app"
          strip_components: 4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_KEY }}
          script: |
            cd /opt/catechis
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:homolog-${{ github.sha }}"
            docker compose -f docker-compose.homolog.yml pull
            docker compose -f docker-compose.homolog.yml run --rm server npx prisma migrate deploy
            docker compose -f docker-compose.homolog.yml up -d
            curl -fsS https://api.homolog.catechis.app/health

      - name: E2E smoke (homolog)
        working-directory: e2e-tests
        run: |
          npm ci
          HOMOLOG_API_URL=https://api.homolog.catechis.app npx playwright test tests/homologSmoke.spec.ts
