name: Deploy Homolog

on:
  push:
    branches: [main]
    # Cloud Agent cannot workflow_dispatch (HTTP 403). Push a homolog-* tag
    # from a feature branch to deploy that commit without merging to main.
    tags:
      - 'homolog-*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: main)'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/catequeze-viva

jobs:
  build-and-deploy:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch uses the input (default: main). Push to main or a
          # homolog-* tag checks out the triggering commit, not always main.
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wasp CLI
        run: npm install -g @wasp.sh/wasp-cli@0.22.0 @wasp.sh/wasp-cli-linux-x64-glibc@0.22.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: app
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="homolog-${{ github.sha }}"
          docker build -f deploy/Dockerfile.server \
            --build-arg DATABASE_URL="${{ secrets.HOMOLOG_DATABASE_URL }}" \
            --build-arg REACT_APP_API_URL=https://api-homolog.catechis.app \
            --build-arg REACT_APP_FAMILY_PORTAL_HOST=familia-homolog.catechis.app \
            --build-arg REACT_APP_STAFF_PORTAL_HOST=homolog.catechis.app \
            --build-arg REACT_APP_META_PIXEL_ID=2069332313989772 \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:homolog-latest" .
          # GHCR sometimes returns "unknown blob" on the first push (layer race).
          push_with_retry() {
            local ref="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if docker push "$ref"; then
                return 0
              fi
              echo "⚠️ docker push ${ref} falhou (tentativa ${attempt}/5)"
              sleep $((attempt * 8))
            done
            echo "ERROR: docker push ${ref} falhou depois de 5 tentativas"
            return 1
          }
          push_with_retry "${IMAGE}:${TAG}"
          sleep 5
          push_with_retry "${IMAGE}:homolog-latest"

      - name: Copy deploy configs to homolog VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_KEY }}
          source: "app/deploy/docker-compose.homolog.yml,app/deploy/Caddyfile.homolog,app/deploy/scripts/*"
          target: "/opt/catechis"
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_TOKEN
          script: |
            cd /opt/catechis
            if [[ -f .env.server ]]; then
              upsert_env() { local k="$1" v="$2"; if grep -q "^${k}=" .env.server; then sed -i "s|^${k}=.*|${k}=${v}|" .env.server; else echo "${k}=${v}" >> .env.server; fi; }
              upsert_env WASP_WEB_CLIENT_URL "https://homolog.catechis.app"
              upsert_env WASP_SERVER_URL "https://api-homolog.catechis.app"
              upsert_env COOKIE_DOMAIN ".catechis.app"
              upsert_env FAMILY_PORTAL_HOST "familia-homolog.catechis.app"
              upsert_env STAFF_PORTAL_HOST "homolog.catechis.app"
              upsert_env BILLING_RECONCILE_EMAIL "simaopedros@gmail.com"
              sed -i '/^REACT_APP_FAMILY_PORTAL_HOST=/d' .env.server
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:homolog-${{ github.sha }}"

            # Cada deploy traz uma imagem nova; sem poda o disco enche e o pull
            # falha com "no space left on device". Quando isso aconteceu, a
            # extração do SPA não rodou e o site passou a servir 404 — com o
            # deploy ainda reportando sucesso.
            # Cada prune tem teto de tempo: num disco cheio, com muitas camadas
            # acumuladas, a poda pode levar dezenas de minutos e travar o passo
            # inteiro (o ssh-action só corta em 30m). Melhor podar o que der no
            # tempo e seguir do que pendurar o deploy.
            echo "── disco antes da limpeza ──"; df -h / | tail -1
            # Sem `--filter until=24h`: foram as imagens das últimas horas que
            # encheram o disco, e o filtro justamente as preservava. `-a` remove
            # só imagens SEM container associado — as dos serviços no ar ficam.
            # Nunca usar --volumes aqui: apagaria o volume do Postgres.
            timeout 120 docker container prune -f || echo "⚠️ container prune excedeu o tempo"
            timeout 600 docker image prune -af || echo "⚠️ image prune excedeu o tempo"
            timeout 300 docker builder prune -af || echo "⚠️ builder prune excedeu o tempo"
            echo "── disco após a limpeza ──"; df -h / | tail -1
            AVAIL_KB=$(df -k --output=avail / | tail -1 | tr -d ' ')
            if [ "${AVAIL_KB:-0}" -lt 3145728 ]; then
              echo "ERROR: menos de 3 GB livres após a poda ($((AVAIL_KB/1024)) MB)."
              echo "O pull da imagem não caberia. Limpe o disco do VPS à mão antes de reimplantar."
              exit 1
            fi

            docker compose -f docker-compose.homolog.yml pull

            # Extract web-app from Docker image directly on VPS.
            # Só apaga o SPA atual depois que o container de origem existe: se o
            # pull/create falhar, é melhor manter a versão anterior no ar do que
            # deixar o diretório vazio servindo 404.
            CID=$(docker create "${IMAGE}")
            rm -rf /opt/catechis/web-app/*
            docker cp "${CID}:/app/web-app/." /opt/catechis/web-app/
            docker rm "${CID}"

            # Verify SPA was extracted (must contain index.html).
            # Chaves, não parênteses: `|| ( ... exit 1 )` sai só do subshell, e o
            # script seguia adiante — foi assim que um deploy sem SPA terminou
            # marcado como sucesso, com o site em 404.
            if [ ! -f /opt/catechis/web-app/index.html ]; then
              echo "ERROR: web-app/index.html ausente — extração do SPA falhou"
              df -h /
              exit 1
            fi

            docker compose -f docker-compose.homolog.yml up -d --force-recreate --remove-orphans
            sleep 10
            docker compose -f docker-compose.homolog.yml run --rm --entrypoint "npx" server prisma migrate deploy --schema=../db/schema.prisma || \
              (sleep 5 && docker compose -f docker-compose.homolog.yml run --rm --entrypoint "npx" server prisma migrate deploy --schema=../db/schema.prisma) || \
              echo "⚠️ migrate deploy failed — check DATABASE_URL in .env.server"
            sleep 5
            docker compose -f docker-compose.homolog.yml run --rm --entrypoint "node" server /app/src/server/scripts/seedJourneyTemplates.mjs
            docker compose -f docker-compose.homolog.yml run --rm --entrypoint "node" server /app/src/server/scripts/runSeedPricingCatalog.mjs
            # Bible / Catechism / Directory remain background (idempotent)
            nohup docker compose -f docker-compose.homolog.yml exec -T server node /app/src/server/scripts/runSeed.mjs > /opt/catechis/seed.log 2>&1 &
            echo "✅ Journey templates and pricing catalog seeded; remaining seed started in background (check /opt/catechis/seed.log)"
            sleep 15
            docker compose -f docker-compose.homolog.yml exec -T server node -e "fetch('http://127.0.0.1:3001/health').then(r=>r.json()).then(j=>{if(j.status!=='ok'){console.error(j);process.exit(1)};console.log(JSON.stringify(j))})"

            # Idempotent: sync Stripe → User when webhooks failed (e.g. HTTP 400 pre raw-body fix)
            chmod +x scripts/reconcile-stripe-billing.sh 2>/dev/null || true
            RECONCILE_EMAIL=$(grep -E '^BILLING_RECONCILE_EMAIL=' .env.server 2>/dev/null | cut -d= -f2- || true)
            if [[ -n "$RECONCILE_EMAIL" ]]; then
              bash scripts/reconcile-stripe-billing.sh --resend-last-invoice "$RECONCILE_EMAIL" || echo "⚠️ billing reconcile failed"
            fi
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cheap gate only: curl checks (no Playwright/Chromium). ~30–90s after deploy.
      # Full browser QA: e2e-tests/tests/homologPastoral.spec.ts (manual / nightly).
      - name: Smoke (homolog)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          CF_HDRS=()
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            CF_HDRS=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          else
            echo "⚠️ CF Access service token not set — curls may fail if Access is on."
          fi

          STAFF=https://homolog.catechis.app
          FAMILY=https://familia-homolog.catechis.app

          # API + DB via public edge
          ready=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 8 "${CF_HDRS[@]}" "${STAFF}/readyz" | grep -q '"status":"ok"'; then
              echo "✅ readyz ok (attempt $i)"
              ready=1
              break
            fi
            echo "⏳ readyz ($i)..."
            sleep 4
          done
          [[ "$ready" == "1" ]] || { echo "❌ readyz failed"; exit 1; }

          check_spa() {
            local origin="$1" path="${2:-/}"
            local url="${origin}${path}"
            local html asset
            html=$(curl -fsS --compressed --max-time 12 "${CF_HDRS[@]}" "$url")
            echo "$html" | grep -q 'id="root"' || { echo "❌ ${url}: #root missing"; exit 1; }
            echo "$html" | grep -qiE 'catequese|catechis' || { echo "❌ ${url}: brand missing"; exit 1; }
            asset=$(echo "$html" | grep -oE '/assets/index-[^"]+\.js' | head -1 || true)
            [[ -n "$asset" ]] || { echo "❌ ${url}: module asset missing"; exit 1; }
            # --compressed: sem Accept-Encoding o entry chunk vem cru (~950 KB em vez
            # de ~310 KB gzip), o que já estourou o timeout numa rede lenta.
            curl -fsS --compressed --max-time 20 --retry 2 --retry-delay 3 \
              -o /dev/null "${CF_HDRS[@]}" "${origin}${asset}"
            echo "✅ ${url} + ${asset}"
          }

          check_spa "$STAFF" /
          check_spa "$FAMILY" /
          check_spa "$FAMILY" /convite

          # OG tags are in static HTML (no JS)
          staff_html=$(curl -fsS --compressed --max-time 12 "${CF_HDRS[@]}" "${STAFF}/")
          echo "$staff_html" | grep -q 'property="og:title"' || echo "$staff_html" | grep -q "property='og:title'" || {
            echo "❌ staff landing missing og:title"; exit 1;
          }
          echo "$staff_html" | grep -qE 'property=.og:image.' || {
            echo "❌ staff landing missing og:image"; exit 1;
          }
          echo "✅ smoke cheap gate passed"
