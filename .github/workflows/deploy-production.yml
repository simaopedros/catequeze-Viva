name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      promote_from_homolog:
        description: 'Promote homolog image instead of rebuilding'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/catequeze-viva

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip notice (prod deploy disabled)
        if: ${{ vars.ENABLE_PROD_DEPLOY != 'true' }}
        run: echo "Production SSH deploy skipped — set repository variable ENABLE_PROD_DEPLOY=true when ready."

      - name: Setup Node.js
        if: ${{ inputs.promote_from_homolog != true }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wasp CLI
        if: ${{ inputs.promote_from_homolog != true }}
        run: npm install -g @wasp.sh/wasp-cli@0.22.0 @wasp.sh/wasp-cli-linux-x64-glibc@0.22.0

      - name: Promote homolog image
        if: ${{ inputs.promote_from_homolog == true }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker pull "${IMAGE}:homolog-${{ github.sha }}"
          docker tag "${IMAGE}:homolog-${{ github.sha }}" "${IMAGE}:prod-${{ github.sha }}"
          docker tag "${IMAGE}:homolog-${{ github.sha }}" "${IMAGE}:prod-latest"
          docker push "${IMAGE}:prod-${{ github.sha }}"
          docker push "${IMAGE}:prod-latest"
          echo "✅ Promoted homolog image to production"

      - name: Build and push production Docker image
        if: ${{ inputs.promote_from_homolog != true }}
        working-directory: app
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker build -f deploy/Dockerfile.server \
            --build-arg DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            --build-arg REACT_APP_API_URL=https://api.catechis.app \
            --build-arg REACT_APP_FAMILY_PORTAL_HOST=familia.catechis.app \
            --build-arg REACT_APP_STAFF_PORTAL_HOST=catechis.app \
            --build-arg REACT_APP_META_PIXEL_ID=2069332313989772 \
            -t "${IMAGE}:prod-${{ github.sha }}" -t "${IMAGE}:prod-latest" .
          docker push "${IMAGE}:prod-${{ github.sha }}"
          docker push "${IMAGE}:prod-latest"

      - name: Smoke-test production image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}"
          CID=$(docker create "${IMAGE}")
          docker cp "${CID}:/app/web-app/index.html" /tmp/smoke-index.html
          docker rm "${CID}"
          test -f /tmp/smoke-index.html && echo "✅ Image smoke test passed"
          grep -q 'Catequese Viva' /tmp/smoke-index.html && echo "✅ Content check passed"

      - name: Pre-deploy backup
        if: ${{ vars.ENABLE_PROD_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/catechis
            ./scripts/backup-db.sh prod || echo "⚠️ backup skipped — configure Bunny + DATABASE_URL"

      - name: Copy deploy configs to production VPS
        if: ${{ vars.ENABLE_PROD_DEPLOY == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "app/deploy/docker-compose.yml,app/deploy/Caddyfile,app/deploy/scripts/*"
          target: "/opt/catechis"
          strip_components: 2

      - name: Deploy to production
        if: ${{ vars.ENABLE_PROD_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_TOKEN
          script: |
            cd /opt/catechis
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}"

            # Mesma poda aplicada ao homolog: lá o disco encheu, o pull falhou
            # com "no space left on device", o SPA não foi extraído e o site
            # ficou em 404. Produção corria o mesmo risco.
            # Com teto de tempo: poda num disco cheio pode demorar demais e
            # travar o passo de SSH inteiro. `-a` remove só imagens sem
            # container associado; as dos serviços no ar ficam. Nunca usar
            # --volumes: apagaria o volume do Postgres.
            df -h / | tail -1
            timeout 120 docker container prune -f || echo "⚠️ container prune excedeu o tempo"
            timeout 600 docker image prune -af || echo "⚠️ image prune excedeu o tempo"
            timeout 300 docker builder prune -af || echo "⚠️ builder prune excedeu o tempo"
            df -h / | tail -1

            docker compose -f docker-compose.yml pull
            CID=$(docker create "${IMAGE}")
            rm -rf /opt/catechis/web-app/*
            docker cp "${CID}:/app/web-app/." /opt/catechis/web-app/
            docker rm "${CID}"
            if [ ! -f /opt/catechis/web-app/index.html ]; then
              echo "ERROR: web-app/index.html ausente — extração do SPA falhou"
              df -h /
              exit 1
            fi
            docker compose -f docker-compose.yml up -d
            sleep 5
            docker compose -f docker-compose.yml run --rm --entrypoint "npx" server prisma migrate deploy --schema=../db/schema.prisma
            sleep 5
            # Journey templates must land before the deploy finishes. The old
            # full seed ran in the background after Bible/Catechism, so a
            # container recycle left production without global templates.
            docker compose -f docker-compose.yml run --rm --entrypoint "node" server /app/src/server/scripts/seedJourneyTemplates.mjs
            # Bible / Catechism / Directory remain background (idempotent)
            nohup docker compose -f docker-compose.yml exec -T server node /app/src/server/scripts/runSeed.mjs > /opt/catechis/seed.log 2>&1 &
            echo "✅ Journey templates seeded; remaining seed started in background"
            sleep 10
            curl -fsS https://api.catechis.app/health
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
