name: Diag Homolog Content (temp)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture server logs & reproduce error
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMOLOG_SSH_HOST }}
          username: ${{ secrets.HOMOLOG_SSH_USER }}
          key: ${{ secrets.HOMOLOG_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/catechis
            echo "===== Recent server logs (last 150 lines, filtered for errors) ====="
            docker compose -f docker-compose.homolog.yml logs --tail=500 server 2>&1 | grep -iE "error|exception|stack|throw|prisma|content|500" | tail -150
            echo ""
            echo "===== Full recent server logs (last 80 lines) ====="
            docker compose -f docker-compose.homolog.yml logs --tail=80 server 2>&1
