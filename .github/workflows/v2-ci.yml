name: v2 CI

on:
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/v2-ci.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-ci.yml']

jobs:
  lint:
    name: v2 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder: passa enquanto não há código em v2/.
      - name: Lint (placeholder)
        run: echo "sem código v2 para lint ainda"

  test:
    name: v2 tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: v2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V2_DATABASE_URL: postgres://postgres:ci_only_password@localhost:5432/v2_ci
    steps:
      - uses: actions/checkout@v4
      - name: Postgres disponível
        run: pg_isready -h localhost -p 5432
      - name: Migrations (up)
        run: bash v2/db/migrate.sh up
      - name: Suíte de RLS e papéis (CA2, R3)
        run: bash v2/db/tests/rls.sh
      - name: Rollback das migrations (down) e reaplicação
        run: |
          bash v2/db/migrate.sh down 2
          left=$(psql "$V2_DATABASE_URL" -qAt -c "select count(*) from pg_namespace where nspname in ('identity','org','catequese','familia','audit','sync')")
          roles=$(psql "$V2_DATABASE_URL" -qAt -c "select count(*) from pg_roles where rolname in ('app_rw','app_auth','v2_api','v2_auth','etl')")
          echo "schemas restantes: $left, papéis restantes: $roles"
          test "$left" = 0 && test "$roles" = 0
          bash v2/db/migrate.sh up
          bash v2/db/tests/rls.sh
      # ETL com dados fictícios entra com a T3.
