services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.homolog:/etc/caddy/Caddyfile:ro
      - ./web-app:/srv/web-app:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  server:
    image: ${IMAGE:-ghcr.io/simaopedros/catequeze-viva:homolog-latest}
    restart: unless-stopped
    env_file: .env.server
    environment:
      BUNNY_STORAGE_HOSTNAME: "storage.bunnycdn.com"
      PRICING_CATALOG_SOURCE: db
    expose:
      - "3001"


volumes:
  caddy_data:
  caddy_config:
